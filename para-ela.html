<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pra você</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,600&family=Figtree:wght@400;500&display=swap">
<style>
:root{--noite:#140f2b;--noite2:#251a4a;--rosa:#f4a6b8;--rosa2:#ff6f91;--ouro:#f2d49b;--texto:#f6eef5;--suave:#c9bcd8;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
#aviso{position:fixed;left:50%;bottom:22px;translate:-50% 0;z-index:30;max-width:90vw;background:var(--noite2);border:1px solid var(--suave);border-radius:14px;padding:12px 18px;text-align:center}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 50% 0%,var(--noite2),var(--noite) 70%);color:var(--texto);font:400 17px/1.6 Figtree,system-ui,sans-serif;overflow-x:hidden}
canvas#ceu{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
section{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
h1,h2,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;margin:0}
h1{font-size:clamp(3rem,13vw,6.5rem);line-height:1;color:var(--rosa)}
h2{font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.15;color:var(--ouro)}
p{max-width:34ch;margin:0}
.suave{color:var(--suave)}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:14px 30px;color:#2a0f24;background:var(--rosa);transition:transform .15s,background .2s}
button:hover{background:var(--ouro)}button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}
button.ghost{background:transparent;color:var(--texto);border:1px solid var(--suave)}

/* envelope */
#abertura{position:fixed;inset:0;z-index:10;background:var(--noite);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity 1s,visibility 1s}
#abertura.some{opacity:0;visibility:hidden}
.env{position:relative;width:min(78vw,320px);aspect-ratio:3/2;background:#3a2a66;border-radius:8px;box-shadow:0 20px 60px #0008;cursor:pointer}
.env::before{content:"";position:absolute;inset:0;border-radius:8px;background:linear-gradient(160deg,transparent 49.5%,#2e2054 50%) bottom/100% 55% no-repeat,linear-gradient(200deg,transparent 49.5%,#33245c 50%) bottom/100% 55% no-repeat}
.aba{position:absolute;left:0;right:0;top:0;height:58%;background:#463380;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;border-radius:8px 8px 0 0}
.lacre{position:absolute;left:50%;top:50%;translate:-50% -50%;width:46px;height:46px;border-radius:50%;background:var(--rosa2);display:grid;place-items:center;font-size:22px;z-index:2;animation:bate 1.6s infinite;transition:opacity .4s}
.env.aberto .aba{transform:rotateX(180deg)}
.env.aberto .lacre{opacity:0}
@keyframes bate{50%{transform:scale(1.15)}}

/* contador */
.contador{display:flex;gap:14px;margin:28px 0 8px}
.contador div{min-width:62px}
.contador b{display:block;font:600 2.4rem/1 "Cormorant Garamond",Georgia,serif;color:var(--ouro);font-variant-numeric:tabular-nums}
.contador small{color:var(--suave);font-size:.8rem}

/* motivos */
.cartao{width:min(88vw,380px);min-height:230px;padding:34px 28px;border-radius:24px;background:linear-gradient(160deg,#ffffff14,#ffffff06);border:1px solid #ffffff22;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:26px 0 22px;transition:opacity .25s,transform .25s}
.cartao.troca{opacity:0;transform:translateY(8px)}
.cartao.serif{font-weight:500}

/* carta */
.carta{max-width:34ch}
.carta p{max-width:none;margin:0 0 1.1em;font-size:1.12rem}
.assina{font:italic 600 2rem "Cormorant Garamond",Georgia,serif;color:var(--rosa)}

#feliz{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;margin-top:10px}
#feliz[hidden]{display:none}
.lista{text-align:left;margin:34px 0 0;padding-left:1.6em}
.lista li{margin:0 0 .9em;padding-left:.3em}
.lista li::marker{color:var(--rosa)}
#cantinho{justify-content:flex-start;padding-top:72px}
.abas{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0}
.abas button{background:transparent;color:var(--texto);border:1px solid var(--suave);padding:10px 18px}
.abas button.ativa{background:var(--rosa);color:#2a0f24;border-color:var(--rosa)}
.painel{width:100%;max-width:420px;text-align:left}
.painel[hidden]{display:none}
.item{display:block;background:#ffffff10;border:1px solid #ffffff22;border-radius:16px;padding:16px 18px;margin:0 0 12px}
label.item{display:flex;gap:12px;align-items:center}
.item h3{margin:0 0 4px;font:600 1.3rem "Cormorant Garamond",Georgia,serif;color:var(--ouro)}
.item p{max-width:none;white-space:pre-wrap}
.painel input,.painel textarea{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--suave);background:#0004;color:var(--texto);margin:0 0 8px}
.painel button{margin:0 6px 8px 0}
.item{position:relative}
.painel .acoes{position:absolute;top:8px;right:10px;display:flex;gap:2px}
.painel .acoes button{background:none;border:0;padding:6px;margin:0;font-size:1.05rem;line-height:1;cursor:pointer}
.painel .lixeira-btn{width:28px;height:28px;padding:0;margin:0;border-radius:8px;background:#ffffff12;border:1px solid #ffffff2b;color:var(--suave);display:inline-grid;place-items:center;flex:0 0 28px;transition:background .15s,color .15s,border-color .15s,transform .12s}
.painel .lixeira-btn:hover{background:#ff6f9126;border-color:var(--rosa2);color:var(--rosa2)}
.painel .lixeira-btn svg{width:15px;height:15px;pointer-events:none}
.painel .confirm-apagar{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.painel .confirm-apagar button{padding:5px 10px;margin:0;font-size:.82rem;border-radius:8px}
.item h3{padding-right:76px}
.edit{display:none;margin-top:18px;padding-top:16px;border-top:1px dashed var(--suave)}
body.editando .edit{display:block}
#secCarta{overflow:hidden}
.carta p{text-shadow:0 0 8px #140f2b,0 0 3px #140f2b}
.jardim{position:absolute;inset:0;z-index:0;pointer-events:none}
.jardim span{position:absolute;line-height:1;user-select:none}
.cartaLinha{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:18px}
@media (min-width:820px){.buque{position:absolute;left:100%;top:50%;translate:0 -50%;margin-left:34px}}
.buque{background:none;border:0;padding:8px;font-size:5.5rem;line-height:1;transform-origin:50% 90%;animation:balanca 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 18px #ff6f9155)}
.buque:hover{background:none}
.buque:active{animation-play-state:paused;scale:.9}
@keyframes balanca{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-5deg)}}
/* final */
.botoes{display:flex;gap:16px;margin-top:30px;min-height:56px;align-items:center;justify-content:center;flex-wrap:wrap}
.cora{position:fixed;bottom:-30px;z-index:5;pointer-events:none;animation:sobe linear forwards}
@keyframes sobe{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.lacre{animation:none}.cora{display:none}*{transition:none!important}}

/* ===== tema céu: sol, lua, original e eclipse ===== */
body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:0;transition:opacity .6s ease,transform .8s ease,filter .6s ease,background .6s ease,box-shadow .6s ease;opacity:0}
body.cx-sky-original{background:radial-gradient(120% 80% at 50% 0%,var(--noite2),var(--noite) 70%)}
body.cx-sky-original canvas#ceu{opacity:1}
body.cx-sky-moon{background:radial-gradient(120% 80% at 50% 0%,var(--noite2),var(--noite) 70%)}
body.cx-sky-moon::before{opacity:1;top:86px;right:10vw;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fffefb 0 22%,#f0e9ff 55%,#d9cff8 100%);box-shadow:0 0 16px rgba(255,248,236,.18),0 0 65px rgba(204,196,255,.16)}
body.cx-sky-moon::after{opacity:.26;inset:-12% -8%;background:radial-gradient(32% 26% at 78% 20%,rgba(248,244,255,.14),transparent 70%)}
body.cx-sky-moon canvas#ceu{opacity:1}
body.cx-sky-eclipse{background:radial-gradient(140% 105% at 50% 0%,#443171 0%,#1f153f 43%,#09070f 100%)}
body.cx-sky-eclipse::before{opacity:1;top:72px;left:50%;transform:translateX(-50%);width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at center,#050507 0 30%,transparent 31%),radial-gradient(circle at center,rgba(255,243,203,.98) 0 36%,rgba(255,179,84,.95) 45%,rgba(255,124,54,.72) 56%,rgba(255,228,160,.18) 68%,rgba(255,228,160,0) 74%);box-shadow:0 0 18px rgba(255,210,131,.38),0 0 78px rgba(255,144,73,.24)}
body.cx-sky-eclipse::after{opacity:1;inset:0;background:radial-gradient(circle at 50% 14%,rgba(255,176,92,.12),transparent 24%),radial-gradient(circle at 50% 35%,rgba(255,255,255,.035),transparent 48%)}
body.cx-sky-eclipse canvas#ceu{opacity:.78}
body.cx-sky-eclipse h1,body.cx-sky-eclipse h2,body.cx-sky-eclipse .serif{text-shadow:0 0 18px rgba(255,176,92,.08)}
@media (max-width:700px){body.cx-sky-moon::before{width:82px;height:82px;top:94px;right:7vw}body.cx-sky-eclipse::before{width:132px;height:132px;top:92px}}

</style>

<style id="cx-expansion-css">
/* Expansão do céu: aplicada somente aos novos temas. */
body.cx-sky-dawn{background:linear-gradient(180deg,#6e83ab 0%,#c594b2 36%,#f7ba9b 71%,#ffe4b2);}
body.cx-sky-rain{background:linear-gradient(160deg,#243a53,#4c687c 58%,#70858d);}

body.cx-sky-meteor{background:radial-gradient(ellipse at top,#303261,#15142e 60%,#080f24);}

body.cx-sky-lanterns{background:linear-gradient(180deg,#1e2042,#4a304f 63%,#9a5a60);}
body.cx-sky-spring{background:linear-gradient(150deg,#759eae,#9cbfbc 55%,#e5b6c4);}
body.cx-sky-summer{background:linear-gradient(165deg,#4486ad,#75b6d1 57%,#f1d29d);}
body.cx-sky-autumn{background:linear-gradient(175deg,#967e89,#be8d71 56%,#efc394);}
body.cx-sky-winter{background:linear-gradient(150deg,#354b69,#7e9fb7 65%,#bdcddd);}
body.cx-sky-birthday{background:radial-gradient(ellipse at 50% 15%,#74436f,#3d2857 53%,#201735);}
body.cx-sky-christmas{background:radial-gradient(ellipse at 50% 0%,#28594b,#193b3d 54%,#192a36);}

    <p id="resposta" class="serif" style="margin-top:28px;font-size:1.6rem;color:var(--ouro)"></p>

/* abertura */
let aberto = false;
function abrir(){
  if (aberto) return; aberto = true;
  $("env").classList.add("aberto");
  setTimeout(() => $("abertura").classList.add("some"), 900);
}
$("env").addEventListener("click", abrir);
$("env").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrir(); } });

/* contador de tempo juntos */
const unidades = ["dias","horas","min","seg"];
$("contador").innerHTML = unidades.map(u => '<div><b data-u="'+u+'">0</b><small>'+u+'</small></div>').join("");
function atualiza(){
  let s = Math.max(0, Math.floor((Date.now() - new Date(CFG.inicio)) / 1000));
  const v = { dias: Math.floor(s/86400), horas: Math.floor(s%86400/3600), min: Math.floor(s%3600/60), seg: s%60 };
  for (const u of unidades) document.querySelector('[data-u="'+u+'"]').textContent = v[u];
}
atualiza(); setInterval(atualiza, 1000);

/* motivos */
let i = 0;
function mostra(){
  const c = $("cartao"); c.classList.add("troca");
  setTimeout(() => { c.textContent = CFG.motivos[i]; c.classList.remove("troca"); $("cont").textContent = (i+1) + " de " + CFG.motivos.length; }, 220);
}
function prox(){ i = (i+1) % CFG.motivos.length; mostra(); }
$("cartao").textContent = CFG.motivos[0]; $("cont").textContent = "1 de " + CFG.motivos.length;
$("prox").addEventListener("click", prox);
$("cartao").addEventListener("click", prox);
$("cartao").addEventListener("keydown", e => { if (e.key === "Enter") prox(); });

/* final: o "não" foge */
const nao = $("nao");
function foge(){
  const sec = nao.closest("section");
  nao.style.position = "absolute";
  const w = Math.max(0, sec.clientWidth - nao.offsetWidth - 24), h = Math.max(0, sec.clientHeight - nao.offsetHeight - 24);
  nao.style.left = (12 + Math.random()*w) + "px"; nao.style.top = (12 + Math.random()*h) + "px";
}
nao.addEventListener("pointerenter", foge);
nao.addEventListener("click", foge);
$("sim").addEventListener("click", () => {
  $("botoes").style.display = "none"; $("resposta").textContent = CFG.final;
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;

    const e = document.createElement("div"); e.className = "cora"; e.textContent = ["♥","💗","💖"][k%3];

  }, k*90);
});

/* senha das cartas (criptografia no próprio navegador) */
const enc = new TextEncoder(), b64 = u => btoa(String.fromCharCode(...new Uint8Array(u))), unb = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function chave(senha, salt){
  const k = await crypto.subtle.importKey("raw", enc.encode(senha), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:100000, hash:"SHA-256"}, k, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function cifra(txt, senha){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, await chave(senha, salt), enc.encode(txt));
  return { salt: b64(salt), iv: b64(iv), ct: b64(ct) };
}
async function decifra(c, senha){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: unb(c.iv)}, await chave(senha, unb(c.salt)), unb(c.ct));
  return new TextDecoder().decode(pt);
}

const cv = $("ceu"), cx = cv.getContext("2d"); let est = [];
function ajusta(){
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  est = Array.from({length: Math.round(innerWidth*innerHeight/6500)}, () => ({x:Math.random(), y:Math.random(), r:Math.random()*1.4+.3, f:Math.random()*6}));
}
function desenha(t){
  cx.clearRect(0,0,cv.width,cv.height);
  for (const s of est){
    cx.globalAlpha = .35 + .65*Math.abs(Math.sin(t/1800 + s.f));
    cx.fillStyle = s.r > 1.3 ? "#f2d49b" : "#f6eef5";
    cx.beginPath(); cx.arc(s.x*cv.width, s.y*cv.height, s.r*devicePixelRatio, 0, 6.283); cx.fill();
  }
  requestAnimationFrame(desenha);
}
ajusta(); addEventListener("resize", ajusta); requestAnimationFrame(desenha);

coupons.addEventListener('click',e=>{const b=e.target.closest('[data-redeem],[data-cancel-coupon]');if(!b)return;runTask(b,async()=>{const x=records.find(x=>x.id===(b.dataset.redeem||b.dataset.cancelCoupon)),actor=needRole();if(!x||!actor||x.redeemed)return;if(b.dataset.redeem&&x.to===actor)await writeRecord({...x,redeemed:true,updated:Date.now()});else if(b.dataset.cancelCoupon&&x.actor===actor&&confirm('Excluir este cupom?'))await deleteRecord(x.id);});});
let lastBeat=0;async function heartbeat(){const r=currentRole();if(!settings.compartilhado||!r||document.hidden||activeStore==='none'||Date.now()-lastBeat<25000)return;lastBeat=Date.now();try{await writeRecord(makeRecord('presence',{actor:r},'presence-'+r));}catch{}}setInterval(()=>{heartbeat();renderCouple();},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){lastBeat=0;heartbeat();}});
function analyzeWhatsApp(text){const map=new Map();let sender=null,body='',messages=0,total=0;const stamp=/^\s*(?:\[\s*)?\d{1,2}[\/\.\-]\d{1,2}[\/\.\-]\d{2,4}(?:,?\s+)(?:às\s+)?\d{1,2}:\d{2}(?::\d{2})?(?:\s*[AP]M)?\s*(?:\]\s*|\s+-\s+)/i;const flush=()=>{if(!sender)return;messages++;const count=(body.normalize('NFC').match(/(?<![\p{L}\p{N}_])eu\s+te\s+amo(?![\p{L}\p{N}_])/giu)||[]).length;total+=count;map.set(sender,(map.get(sender)||0)+count);};for(const raw of text.split(/\r?\n/)){const line=raw.replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g,'');const m=line.match(stamp);if(m){flush();const rest=line.slice(m[0].length),idx=rest.indexOf(': ');sender=idx>0?rest.slice(0,idx).trim():null;body=sender?rest.slice(idx+2):'';}else if(sender)body+='\n'+line;}flush();return {total,messages,people:[...map].sort((a,b)=>b[1]-a[1]),at:Date.now()};}
function renderWA(){const stats=localGet('cx-wa-stat',null),out=whatsapp.querySelector('[data-wa-result]');out.replaceChildren();if(!stats)return;const n=document.createElement('div');n.className='cx-stat';n.textContent=String(stats.total);const label=document.createElement('p');label.textContent='vezes que escreveram “eu te amo”';label.style.textAlign='center';out.append(n,label);for(const [name,count] of stats.people){const p=document.createElement('p');p.textContent=`${name}: ${count}`;out.append(p);}const p=document.createElement('p');p.className='cx-mini';p.textContent=`${stats.messages} mensagens reconhecidas no arquivo.`;out.append(p);}
setCoupleForm(whatsapp,'[data-wa-form]',async f=>{const file=f.elements.chat.files[0];if(!file||!file.name.toLowerCase().endsWith('.txt'))throw Error('Selecione um arquivo TXT exportado sem mídia.');if(file.size>40*1024*1024)throw Error('Arquivo acima de 40 MB.');const stats=analyzeWhatsApp(await file.text());if(!stats.messages)throw Error('Não reconheci o formato da conversa. Exporte o chat sem mídia.');localSet('cx-wa-stat',stats);renderWA();});whatsapp.querySelector('[data-clear-wa]').onclick=()=>{localSet('cx-wa-stat',null);renderWA();};renderWA();

function anniversary(day,start){const [y,m,d]=day.split('-').map(Number),[sy,sm,sd]=start.slice(0,10).split('-').map(Number);const months=(y-sy)*12+m-sm;const lastDay=new Date(Date.UTC(y,m,0)).getUTCDate();return months>0&&d===Math.min(sd,lastDay)?months:0;}
let celebratedSession='';
function celebrate(){const day=today(),months=anniversary(day,cfg.inicio);if(!months||celebratedSession===day)return;try{if(localStorage.getItem('cx-celebrated')===day)return;}catch{}if(modal)return;celebratedSession=day;try{localStorage.setItem('cx-celebrated',day);}catch{}const title=months%12===0?`${months/12} ${months===12?'ano':'anos'} de nós!`:`${months} ${months===1?'mês':'meses'} de nós!`;const body=openModal(`<div class="cx-celebrate-icon">☀️🖤🌙</div><h2>${esc(title)}</h2><p>Hoje celebramos mais um pedacinho da nossa história. No modo Automático, o nosso céu se transforma em eclipse.</p><p>Mais um pedacinho da nossa história, com amor e muitas lembranças pela frente.</p><div class="cx-modal-actions"><button type="button">Celebrar juntos ♥</button></div>`);body.querySelector('button').onclick=closeModal;if(!reduce())for(let k=0;k<30;k++){const c=document.createElement('span');c.className='cx-confetti';c.setAttribute('aria-hidden','true');c.textContent=['♥','✦','♡','🌸'][k%4];c.style.left=Math.random()*100+'vw';c.style.color=k%2?'var(--rosa)':'var(--ouro)';c.style.animationDelay=Math.random()*.9+'s';document.body.append(c);setTimeout(()=>c.remove(),4700);}}
const env=byId('env');if(env){const afterOpen=()=>setTimeout(celebrate,1250);env.addEventListener('click',afterOpen,{once:true});env.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')afterOpen();});}else setTimeout(celebrate,500);
dailyUpdate();themeUpdate();setInterval(()=>{dailyUpdate();themeUpdate();render();if(byId('abertura')?.classList.contains('some'))celebrate();},60000);
render();
if(!settings.compartilhado)loadLocal();else{
 activeStore='none';
 import('./cantinho-extra.firebase.js').then(async m=>{remote=await m.connect(settings.firebase,async u=>{user=u;generation++;unsubscribe?.();records=[];render();if(!u){activeStore='none';syncStatus('Entrem com suas contas para ver as fotos e memórias compartilhadas.');return;}activeStore='none';syncStatus('Verificando acesso…');unsubscribe=remote.watch(rows=>{activeStore='remote';records=rows;render();heartbeat();syncStatus('Cantinho compartilhado · sincronizado');},()=>{activeStore='none';records=[];render();syncStatus('Sem acesso às memórias. Verifique as regras do Firebase.');});});syncStatus('Entrem com suas contas para sincronizar o cantinho.');}).catch(()=>syncStatus('Não foi possível conectar. Verifique a configuração do Firebase.'));
}
})();
