<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nosso cantinho — Cadastro</title><style> *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#36235a,#140f2b 75%);color:#f6eef5;font:16px/1.6 system-ui,sans-serif}main{width:min(100%,420px);border:1px solid #ffffff25;border-radius:26px;background:#ffffff09;text-align:center;padding:30px 24px}h1{font:italic 36px Georgia,serif;color:#f2d49b;margin:8px 0}p{color:#d8cce7}button{font:inherit;border:0;border-radius:24px;padding:12px 22px;cursor:pointer;background:#f4a6b8;color:#30172e;margin:5px}button:disabled{opacity:.5;cursor:wait}button:focus-visible{outline:3px solid #f2d49b;outline-offset:3px}button.secondary{background:transparent;border:1px solid #bba9cf;color:#f6eef5}#uid{width:100%;font:14px monospace;border:1px solid #9883a8;background:#140f2b;color:#fff;padding:10px;border-radius:8px}#status{overflow-wrap:anywhere}small{color:#c9bcd8} [hidden]{display:none!important}</style></head><body><main><div style="font-size:40px" aria-hidden="true">☀️ 🌙</div><h1>Nosso cantinho</h1><p>Página temporária para identificar as duas contas do casal.</p><button id="login" disabled>Entrar com Google</button><div id="result" hidden><p id="identity"></p><label for="uid">Identificador (UID)</label><input id="uid" readonly><button id="copy" type="button">Copiar UID</button><button id="logout" class="secondary" type="button">Sair / trocar conta</button></div><p id="status" role="status">Carregando autenticação…</p><small>Esta página não lê nem grava dados do Firestore. Não compartilhe senhas.</small></main><script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, setPersistence, inMemoryPersistence, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
const firebaseConfig = {
  apiKey: "AIzaSyDAXpFJafiXGNyOwU_5B0CRGwa5hYbXAQ",
  authDomain: "cantinho-sarah.firebaseapp.com",
  projectId: "cantinho-sarah",
  storageBucket: "cantinho-sarah.firebasestorage.app",
  messagingSenderId: "705673397820",
  appId: "1:705673397820:web:f754f7eb9974dacfe5a539"
};
const el=id=>document.getElementById(id), status=el('status'), login=el('login');
try {
const auth=getAuth(initializeApp(firebaseConfig,'cadastro-cantinho'));
await setPersistence(auth,inMemoryPersistence);
const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
onAuthStateChanged(auth,u=>{login.hidden=!!u;login.disabled=false;el('result').hidden=!u;el('uid').value=u?.uid||'';el('identity').textContent=u?.email||u?.displayName||'';status.textContent=u?'Conta identificada! Copie o UID e indique se é Sol ou Lua.':'Escolha sua conta Google.';});
login.onclick=async()=>{login.disabled=true;status.textContent='Abrindo login do Google…';try{await signInWithPopup(auth,provider);}catch(e){status.textContent='Não foi possível entrar: '+(e.code||e.message)+'. Permita pop-ups e tente novamente.';}finally{login.disabled=false;}};
el('logout').onclick=async()=>{try{await signOut(auth);}catch(e){status.textContent='Não foi possível sair: '+(e.code||e.message);}};
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(el('uid').value);status.textContent='UID copiado!';}catch{el('uid').select();status.textContent='Selecione e copie o identificador manualmente.';}};
}catch(e){status.textContent='Falha ao iniciar o Firebase: '+(e.code||e.message);}
</script></body></html>
